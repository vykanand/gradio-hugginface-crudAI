# DeepSource configuration file
# Learn how to configure: https://docs.deepsource.com/docs/configuration
version = 1
# Files / folders to include in analysis. Ensure all JS variants are scanned.
include_patterns = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx"]
exclude_patterns = ["node_modules", "bower_components", "out", "bin", "build", "dist", "venv"]
# Test file patterns (these are typically excluded from some checks)
test_patterns = ["**/__tests__/**", "**/*.spec.ts", "**/*.spec.js", "**/*.test.ts", "**/*.test.js", "**/test_*.py"]

[[analyzers]]
  name = "javascript"
  enabled = true

[[analyzers]]
  name = "php"
  enabled = true

[[analyzers]]
  name = "python"
  enabled = true
