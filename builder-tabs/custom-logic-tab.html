<div id="custom-logic-panel" class="tab-panel">
  <div class="toolbar">
    <button class="btn btn-secondary" onclick="loadCustomLogics()">
      &#128260; Refresh
    </button>
    <button class="btn btn-secondary" onclick="clearLogicEditor()">
      &#10133; New Logic
    </button>
    <div
      style="margin-left: 16px; display: inline-block; vertical-align: middle"
    >
      <strong style="font-size: 0.95rem">Active Workflow:</strong>
      <span
        id="custom-logic-active-workflow"
        style="margin-left: 8px; color: #333"
        >(none)</span
      >
    </div>
  </div>
  <div class="main" style="display: flex; gap: 16px">
    <div class="sidebar" style="width: 300px">
      <h3 style="margin-top: 0">Custom Logic</h3>
      <div style="margin-bottom: 8px; font-size: 0.95rem; color: #444">
        Custom Logic
      </div>
      <div id="custom-logic-list"></div>
      <div
        id="custom-logic-empty-state"
        style="display: none; color: #666; padding: 8px"
      >
        No custom logic defined
      </div>
    </div>
    <div class="content-area" style="flex: 1">
      <div id="custom-logic-editor" style="display: none">
        <input
          id="logic-name"
          placeholder="Name"
          style="width: 100%; margin-bottom: 8px; padding: 8px"
        />
        <input
          id="logic-description"
          placeholder="Short description"
          style="width: 100%; margin-bottom: 8px; padding: 8px"
        />
        <!-- Connect inputs area: placed after description to match DB Actions layout -->
        <div id="custom-logic-connect-inputs" style="margin: 8px 0 12px"></div>
        <div style="margin-bottom: 8px">
          <label style="font-weight: 600">Function code</label>
          <textarea
            id="logic-function"
            style="
              width: 100%;
              height: 240px;
              font-family: monospace;
              margin-top: 4px;
            "
          ></textarea>
        </div>
        <!-- Test Data, Variables Preview, and Input Shape removed per request -->

        <!-- Footer actions: Save/Delete placed at bottom of editor -->
        <div
          id="custom-logic-footer"
          style="
            position: sticky;
            bottom: 0;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #e6eef3;
            margin-top: 12px;
          "
        >
          <button
            class="btn btn-primary"
            id="custom-logic-save-btn"
            onclick="saveCustomLogic()"
          >
            Save
          </button>
          <button
            class="btn btn-secondary"
            id="custom-logic-delete-btn"
            onclick="deleteCurrentLogic()"
          >
            Delete
          </button>
          <div
            id="custom-logic-action-status"
            style="margin-left: 12px; color: #657786"
          >
            &nbsp;
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Load reusable explorer and connect-inputs modules
  (function ensureModulesLoaded() {
    if (!window.createExplorer) {
      var s = document.createElement("script");
      s.src = "/assets/explorer.js";
      document.head.appendChild(s);
    }
    if (!window.renderConnectInputPills) {
      var s2 = document.createElement("script");
      s2.src = "/assets/connect-inputs.js";
      document.head.appendChild(s2);
    }
  })();

  // Minimal state
  var logicList = [];
  var currentLogic = null;
  var logicInputs = [];

  // Init hook exposed for parent page
  window.initCustomLogicTab = async function () {
    // Show active workflow
    var wfEl = document.getElementById("custom-logic-active-workflow");
    if (wfEl && window.currentWorkflow) {
      wfEl.textContent =
        window.currentWorkflow.name || window.currentWorkflow.id || "(none)";
    }

    // Enable drop/insert for logic-function textarea. Prefer central VariableInsertion
    try {
      const logicFunc = document.getElementById("logic-function");
      if (logicFunc) {
        if (
          typeof window.VariableInsertion !== "undefined" &&
          typeof VariableInsertion.enableDropZone === "function"
        ) {
          try {
            VariableInsertion.enableDropZone(logicFunc);
          } catch (e) {
            /* fallback below */
          }
        } else {
          // fallback minimal drop support when VariableInsertion not available
          logicFunc.addEventListener("dragover", function (e) {
            e.preventDefault();
          });
          logicFunc.addEventListener("drop", function (e) {
            try {
              e.preventDefault();
              let text = e.dataTransfer.getData("text/plain") || "";
              if (!text) {
                const json = e.dataTransfer.getData("application/json");
                if (json) {
                  try {
                    const p = JSON.parse(json);
                    if (p && p.eventParserNodeId && p.path)
                      text = `{{event_parser_${p.eventParserNodeId}.${p.path}}}`;
                    else if (p && p.actionId && p.path)
                      text = `{{action_${p.actionId}.${p.path}}}`;
                  } catch (err) {}
                }
              }
              if (text && typeof globalThis.insertAtCursor === "function") {
                globalThis.insertAtCursor(logicFunc, text);
                logicFunc.dispatchEvent(new Event("input", { bubbles: true }));
              }
            } catch (err) {
              console.warn("logic-function drop failed", err);
            }
          });
        }
      }
    } catch (e) {}

    // Load logics
    await loadCustomLogics();
  };

  // Initialize on DOM ready if panel exists
  (function autoInit() {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(autoInit, 100);
      });
    } else {
      setTimeout(function () {
        if (typeof window.initCustomLogicTab === "function") {
          window.initCustomLogicTab();
        }
      }, 200);
    }
  })();

  function clearLogicEditor() {
    currentLogic = null;
    logicInputs = [];
    var editor = document.getElementById("custom-logic-editor");
    if (editor) editor.style.display = "block";
    document.getElementById("logic-name").value = "";
    document.getElementById("logic-description").value = "";
    document.getElementById("logic-function").value = "";
  }

  async function loadCustomLogics() {
    var listEl = document.getElementById("custom-logic-list");
    if (!listEl) return;

    if (typeof window.createExplorer === "function") {
      // capture the onSelect handler so we can call it programmatically on refresh
      var selectHandler = function (it) {
        currentLogic = it;
        logicInputs = it.inputs || [];
        document.getElementById("custom-logic-editor").style.display = "block";
        document.getElementById("logic-name").value = it.name || "";
        document.getElementById("logic-description").value =
          it.description || "";
        document.getElementById("logic-function").value =
          it.functionCode || it.function || "";
        // focus editor so click-to-insert works
        try {
          const lf = document.getElementById("logic-function");
          if (lf) lf.focus();
        } catch (e) {}
        // render connect input pills for this logic using shared renderer
        try {
          if (typeof window.renderConnectInputPills === "function") {
            // map selected logic component to workflow node ids (nodes of type 'custom-logic')
            var targetNodeIds = [];
            try {
              var allNodes = window.nodes || [];
              allNodes.forEach(function (n) {
                try {
                  if (!n) return;
                  if (
                    n.type === "custom-logic" &&
                    n.data &&
                    (String(n.data.logicId) === String(it.id) ||
                      String(n.data.logic) === String(it.id) ||
                      String(n.id) === String(it.id))
                  ) {
                    targetNodeIds.push(n.id);
                  }
                } catch (ee) {}
              });
            } catch (ee) {
              targetNodeIds = [];
            }
            if (!targetNodeIds || !targetNodeIds.length)
              targetNodeIds = [it.id];

            window.renderConnectInputPills({
              containerId: "custom-logic-connect-inputs",
              targetIds: targetNodeIds,
              title: "Connect Inputs (from workflow)",
              onAttach: function (entry, node) {
                try {
                  // attach hint: add to logicInputs (avoid duplicates) and persist immediately
                  logicInputs = logicInputs || [];
                  var exists = logicInputs.some(function (li) {
                    return (
                      li &&
                      li.source === "connect" &&
                      String(li.nodeId) === String(node.id)
                    );
                  });
                  if (!exists) {
                    logicInputs.push({ source: "connect", nodeId: node.id });
                  }
                  currentLogic = currentLogic || {};
                  currentLogic.inputs = logicInputs;
                  // Persist to backend immediately
                  try {
                    (async function () {
                      try {
                        await saveCustomLogic();
                        try {
                          if (typeof showToast === "function")
                            showToast(
                              "Attached Connect input to logic",
                              "success",
                            );
                        } catch (e) {}
                        // re-render pills to reflect any backend-normalized state
                        try {
                          if (
                            typeof window.renderConnectInputPills === "function"
                          ) {
                            // recompute node ids for currentLogic before re-render
                            var reNodeIds = [];
                            try {
                              var allNodes2 = window.nodes || [];
                              allNodes2.forEach(function (n2) {
                                try {
                                  if (!n2) return;
                                  if (
                                    n2.type === "custom-logic" &&
                                    n2.data &&
                                    (String(n2.data.logicId) ===
                                      String(currentLogic.id) ||
                                      String(n2.data.logic) ===
                                        String(currentLogic.id) ||
                                      String(n2.id) === String(currentLogic.id))
                                  )
                                    reNodeIds.push(n2.id);
                                } catch (ee) {}
                              });
                            } catch (ee) {
                              reNodeIds = [];
                            }
                            if (!reNodeIds || !reNodeIds.length)
                              reNodeIds = [
                                currentLogic.id || currentLogic.name,
                              ];
                            window.renderConnectInputPills({
                              containerId: "custom-logic-connect-inputs",
                              targetIds: reNodeIds,
                              title: "Connect Inputs (from workflow)",
                            });
                          }
                        } catch (e) {}
                      } catch (err) {
                        console.warn(
                          "saveCustomLogic failed after attach",
                          err,
                        );
                        try {
                          if (typeof showToast === "function")
                            showToast(
                              "Failed to persist attached input",
                              "error",
                            );
                        } catch (e) {}
                      }
                    })();
                  } catch (e) {}
                } catch (e) {
                  console.warn("onAttach custom logic failed", e);
                }
              },
            });
          }
        } catch (e) {
          console.warn("renderConnectInputPills for custom logic failed", e);
        }
        // exampleContextUI handling removed (Test Data UI removed)
      };

      // keep a ref to selectHandler for onRefresh
      var thisOptionsOnSelect = selectHandler;

      window.createExplorer({
        containerId: "custom-logic-list",
        fetchItems: async function () {
          if (!window.currentWorkflow || !window.currentWorkflow.id) return [];
          var res = await fetch(
            "/api/unified-workflows/" +
              window.currentWorkflow.id +
              "/components",
          );
          if (!res.ok) return [];
          var data = await res.json();
          return data.logics || data.data || data || [];
        },
        itemLabel: function (it) {
          return it.name || it.id || "(untitled)";
        },
        nodeTypeMatch: "connect",
        onSelect: selectHandler,
        onRefresh: function (items) {
          try {
            var emptyEl = document.getElementById("custom-logic-empty-state");
            if (!items || items.length === 0) {
              if (emptyEl) emptyEl.style.display = "block";
            } else {
              if (emptyEl) emptyEl.style.display = "none";
              // Auto-select first item only when nothing is currently selected
              try {
                if (
                  !currentLogic &&
                  typeof thisOptionsOnSelect === "function"
                ) {
                  thisOptionsOnSelect(items[0]);
                }
              } catch (e) {}
            }
          } catch (e) {}
        },
      });
    } else {
      listEl.innerHTML = '<div style="color:#666">Loading...</div>';
    }
  }

  async function saveCustomLogic() {
    var name = document.getElementById("logic-name").value.trim();
    var description = document.getElementById("logic-description").value.trim();
    var functionCode = document.getElementById("logic-function").value.trim();

    if (!name) {
      alert("Name is required");
      return;
    }
    if (!functionCode) {
      alert("Function code is required");
      return;
    }

    var logic = {
      id: currentLogic
        ? currentLogic.id
        : "logic_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9),
      name: name,
      description: description,
      inputs: logicInputs,
      functionCode: functionCode,
      updatedAt: new Date().toISOString(),
    };

    var method = currentLogic ? "PUT" : "POST";
    var url = currentLogic
      ? "/api/custom-logic/" + currentLogic.id
      : "/api/custom-logic";

    try {
      var res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(logic),
      });
      var data = await res.json();
      var statusEl = document.getElementById("custom-logic-action-status");
      if (data.ok) {
        try {
          if (typeof showToast === "function")
            showToast("Saved successfully", "success");
        } catch (e) {}
        if (statusEl) {
          statusEl.textContent = "Saved";
          statusEl.style.color = "#28a745";
        }
        await loadCustomLogics();
        currentLogic = logic;
        setTimeout(function () {
          if (statusEl) {
            statusEl.textContent = "\u00A0";
          }
        }, 3000);
      } else {
        try {
          if (typeof showToast === "function")
            showToast("Save failed", "error");
        } catch (e) {}
        if (statusEl) {
          statusEl.textContent = "Save failed";
          statusEl.style.color = "#c53030";
        }
        console.warn("saveCustomLogic failed", data.error || data);
      }
    } catch (e) {
      alert("Save error: " + e.message);
    }
  }

  async function deleteCurrentLogic() {
    if (!currentLogic) return;
    if (!confirm('Delete "' + currentLogic.name + '"?')) return;

    try {
      var res = await fetch("/api/custom-logic/" + currentLogic.id, {
        method: "DELETE",
      });
      var data = await res.json();
      var statusEl = document.getElementById("custom-logic-action-status");
      if (data.ok) {
        try {
          if (typeof showToast === "function") showToast("Deleted", "success");
        } catch (e) {}
        if (statusEl) {
          statusEl.textContent = "Deleted";
          statusEl.style.color = "#28a745";
        }
        await loadCustomLogics();
        clearLogicEditor();
        setTimeout(function () {
          if (statusEl) {
            statusEl.textContent = "\u00A0";
          }
        }, 3000);
      } else {
        try {
          if (typeof showToast === "function")
            showToast("Delete failed", "error");
        } catch (e) {}
        if (statusEl) {
          statusEl.textContent = "Delete failed";
          statusEl.style.color = "#c53030";
        }
      }
    } catch (e) {
      alert("Delete error: " + e.message);
    }
  }

  // testCustomLogic removed — Test Data UI and related functionality deleted
</script>
