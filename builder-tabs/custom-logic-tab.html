<div id="custom-logic-panel" class="tab-panel">
  <div class="toolbar">
    <button class="btn btn-secondary" onclick="loadCustomLogics()">
      &#128260; Refresh
    </button>
    <button class="btn btn-secondary" onclick="clearLogicEditor()">
      &#10133; New Logic
    </button>
    <div
      style="margin-left: 16px; display: inline-block; vertical-align: middle"
    >
      <strong style="font-size: 0.95rem">Active Workflow:</strong>
      <span
        id="custom-logic-active-workflow"
        style="margin-left: 8px; color: #333"
        >(none)</span
      >
    </div>
  </div>
  <div class="main" style="display: flex; gap: 16px">
    <div class="sidebar" style="width: 300px">
      <h3 style="margin-top: 0">Custom Logic</h3>
      <div style="margin-bottom: 8px; font-size: 0.95rem; color: #444">
        Custom Logic
      </div>
      <div id="custom-logic-list"></div>
      <div
        id="custom-logic-empty-state"
        style="display: none; color: #666; padding: 8px"
      >
        No custom logic defined
      </div>
    </div>
    <div class="content-area" style="flex: 1">
      <div id="custom-logic-editor" style="display: none">
        <input
          id="logic-name"
          placeholder="Name"
          style="width: 100%; margin-bottom: 8px; padding: 8px"
        />
        <input
          id="logic-description"
          placeholder="Short description"
          style="width: 100%; margin-bottom: 8px; padding: 8px"
        />
        <div style="display: flex; gap: 8px; margin-bottom: 8px">
          <button class="btn btn-primary" onclick="saveCustomLogic()">
            Save
          </button>
          <button class="btn btn-secondary" onclick="deleteCurrentLogic()">
            Delete
          </button>
          <div id="custom-logic-connect-inputs" style="margin-top: 8px"></div>
        </div>
        <div style="margin-bottom: 8px">
          <label style="font-weight: 600">Function code</label>
          <textarea
            id="logic-function"
            style="
              width: 100%;
              height: 240px;
              font-family: monospace;
              margin-top: 4px;
            "
          ></textarea>
        </div>
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <div style="flex: 1">
            <label style="font-weight: 600">Test Data</label>
            <textarea
              id="logic-test-data"
              style="
                width: 100%;
                height: 160px;
                font-family: monospace;
                margin-top: 4px;
              "
            ></textarea>
            <div
              id="logic-test-result"
              style="
                display: none;
                margin-top: 8px;
                padding: 8px;
                border-radius: 6px;
              "
            ></div>
            <div style="margin-top: 8px">
              <button class="btn btn-secondary" onclick="testCustomLogic()">
                Run Test
              </button>
            </div>
          </div>
          <div style="width: 320px">
            <label style="font-weight: 600">Variables Preview</label>
            <div
              id="variable-preview-list"
              style="
                background: #fff;
                border: 1px solid #e6eef3;
                padding: 8px;
                min-height: 100px;
                margin-top: 4px;
              "
            ></div>
            <label style="font-weight: 600; margin-top: 8px; display: block"
              >Input Shape</label
            >
            <pre
              id="input-shape-schema"
              style="
                background: #f8f9fa;
                border: 1px solid #e6eef3;
                padding: 8px;
                height: 160px;
                overflow: auto;
              "
            ></pre>
            <div
              id="input-validation-status"
              style="display: none; margin-top: 6px"
            >
              <span id="validation-icon"></span
              ><span id="validation-message"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Load reusable explorer and connect-inputs modules
  (function ensureModulesLoaded() {
    if (!window.createExplorer) {
      var s = document.createElement("script");
      s.src = "/assets/explorer.js";
      document.head.appendChild(s);
    }
    if (!window.renderConnectInputPills) {
      var s2 = document.createElement("script");
      s2.src = "/assets/connect-inputs.js";
      document.head.appendChild(s2);
    }
  })();

  // Minimal state
  var logicList = [];
  var currentLogic = null;
  var logicInputs = [];

  // Init hook exposed for parent page
  window.initCustomLogicTab = async function () {
    // Show active workflow
    var wfEl = document.getElementById("custom-logic-active-workflow");
    if (wfEl && window.currentWorkflow) {
      wfEl.textContent =
        window.currentWorkflow.name || window.currentWorkflow.id || "(none)";
    }

    // Load logics
    await loadCustomLogics();
  };

  // Initialize on DOM ready if panel exists
  (function autoInit() {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(autoInit, 100);
      });
    } else {
      setTimeout(function () {
        if (typeof window.initCustomLogicTab === "function") {
          window.initCustomLogicTab();
        }
      }, 200);
    }
  })();

  function clearLogicEditor() {
    currentLogic = null;
    logicInputs = [];
    var editor = document.getElementById("custom-logic-editor");
    if (editor) editor.style.display = "block";
    document.getElementById("logic-name").value = "";
    document.getElementById("logic-description").value = "";
    document.getElementById("logic-function").value = "";
    document.getElementById("logic-test-data").value = "";
    var result = document.getElementById("logic-test-result");
    if (result) result.style.display = "none";
  }

  async function loadCustomLogics() {
    var listEl = document.getElementById("custom-logic-list");
    if (!listEl) return;

    if (typeof window.createExplorer === "function") {
      window.createExplorer({
        containerId: "custom-logic-list",
        fetchItems: async function () {
          if (!window.currentWorkflow || !window.currentWorkflow.id) return [];
          var res = await fetch(
            "/api/unified-workflows/" +
              window.currentWorkflow.id +
              "/components",
          );
          if (!res.ok) return [];
          var data = await res.json();
          return data.logics || data.data || data || [];
        },
        itemLabel: function (it) {
          return it.name || it.id || "(untitled)";
        },
        nodeTypeMatch: "connect",
        onSelect: function (it) {
          currentLogic = it;
          logicInputs = it.inputs || [];
          document.getElementById("custom-logic-editor").style.display =
            "block";
          document.getElementById("logic-name").value = it.name || "";
          document.getElementById("logic-description").value =
            it.description || "";
          document.getElementById("logic-function").value =
            it.functionCode || it.function || "";
          if (it.exampleContextUI) {
            document.getElementById("logic-test-data").value = JSON.stringify(
              it.exampleContextUI,
              null,
              2,
            );
          }
        },
      });
    } else {
      listEl.innerHTML = '<div style="color:#666">Loading...</div>';
    }
  }

  async function saveCustomLogic() {
    var name = document.getElementById("logic-name").value.trim();
    var description = document.getElementById("logic-description").value.trim();
    var functionCode = document.getElementById("logic-function").value.trim();

    if (!name) {
      alert("Name is required");
      return;
    }
    if (!functionCode) {
      alert("Function code is required");
      return;
    }

    var logic = {
      id: currentLogic
        ? currentLogic.id
        : "logic_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9),
      name: name,
      description: description,
      inputs: logicInputs,
      functionCode: functionCode,
      updatedAt: new Date().toISOString(),
    };

    var method = currentLogic ? "PUT" : "POST";
    var url = currentLogic
      ? "/api/custom-logic/" + currentLogic.id
      : "/api/custom-logic";

    try {
      var res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(logic),
      });
      var data = await res.json();
      if (data.ok) {
        alert("Saved successfully");
        await loadCustomLogics();
        currentLogic = logic;
      } else {
        alert("Save failed: " + (data.error || "unknown"));
      }
    } catch (e) {
      alert("Save error: " + e.message);
    }
  }

  async function deleteCurrentLogic() {
    if (!currentLogic) return;
    if (!confirm('Delete "' + currentLogic.name + '"?')) return;

    try {
      var res = await fetch("/api/custom-logic/" + currentLogic.id, {
        method: "DELETE",
      });
      var data = await res.json();
      if (data.ok) {
        alert("Deleted");
        await loadCustomLogics();
        clearLogicEditor();
      } else {
        alert("Delete failed");
      }
    } catch (e) {
      alert("Delete error: " + e.message);
    }
  }

  async function testCustomLogic() {
    var functionCode = document.getElementById("logic-function").value;
    var testDataStr = document.getElementById("logic-test-data").value;
    var testData = {};

    try {
      testData = testDataStr ? JSON.parse(testDataStr) : {};
    } catch (e) {
      testData = {};
    }

    try {
      var func = new Function("inputs", functionCode);
      var result = func(testData);
      if (result && typeof result.then === "function") {
        result = await result;
      }

      var resultEl = document.getElementById("logic-test-result");
      resultEl.style.display = "block";
      resultEl.style.background = "#d4edda";
      resultEl.style.border = "1px solid #c3e6cb";
      resultEl.style.color = "#155724";
      resultEl.innerHTML =
        "<strong>&#9989; Success</strong><pre>" +
        JSON.stringify(result, null, 2) +
        "</pre>";
    } catch (e) {
      var resultEl = document.getElementById("logic-test-result");
      resultEl.style.display = "block";
      resultEl.style.background = "#f8d7da";
      resultEl.style.border = "1px solid #f5c6cb";
      resultEl.style.color = "#721c24";
      resultEl.innerHTML =
        "<strong>&#10060; Error</strong><div>" + e.message + "</div>";
    }
  }
</script>
